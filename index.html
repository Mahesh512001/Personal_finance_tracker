
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>

    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js" defer></script>
</head>

<body>
<div class="container-fluid py-3">
    <h2 class="text-center">Personal Finance Tracker</h2>
    <div id="alert-container" class="container mt-3"></div>

    <!-- Filter and Report Buttons -->
    <div class="d-flex justify-content-center gap-3 m-3">
        <button type="button" class="btn btn-primary w-50"
                data-bs-toggle="collapse" data-bs-target="#filter-panel">
            <i class="bi bi-funnel"></i> Filter
        </button>
        <button type="button" class="btn btn-success w-50"
                onclick="generateReport()">
            <i class="bi bi-file-earmark-bar-graph"></i> Report
        </button>
    </div>

    <!-- Filter Panel -->
    <div class="collapse mb-4" id="filter-panel">
        <div class="card card-body">
            <h5>Filter Transactions</h5>
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="filter-type" class="form-label">Type</label>
                    <select id="filter-type" class="form-select">
                        <option value="">All types</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filter-category" class="form-label">Category</label>
                    <select id="filter-category" class="form-select">
                        <option value="">All categories</option>
                        <option value="Salary">Salary</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filter-from" class="form-label">From Date</label>
                    <input type="date" id="filter-from" class="form-control">
                </div>
                <div class="col-md-3">
                    <label for="filter-to" class="form-label">To Date</label>
                    <input type="date" id="filter-to" class="form-control">
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="button" class="btn btn-primary" onclick="applyFilters()">Apply Filter</button>
                <button type="button" class="btn btn-secondary" onclick="resetFilters()">Reset</button>
            </div>
        </div>
    </div>

    <!-- Report Panel -->
    <div id="report-panel" class="card mb-4 d-none">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Transaction Report</h5>
            <button type="button" class="btn-close" onclick="closeReport()" aria-label="Close"></button>
        </div>
        <div class="card-body">
            <div class="row g-3 text-center">
                <div class="col-md-3">
                    <div class="border rounded p-3 h-100">
                        Transactions: <strong id="report-count">0</strong>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="border rounded p-3 h-100 text-success">
                        Income: ₹<strong id="report-income">0.00</strong>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="border rounded p-3 h-100 text-danger">
                        Expenses: ₹<strong id="report-expenses">0.00</strong>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="border rounded p-3 h-100">
                        Balance: ₹<strong id="report-balance">0.00</strong>
                    </div>
                </div>
            </div>

            <h6 class="mt-4">Category Breakdown</h6>
            <div class="table-responsive">
                <table class="table table-bordered table-sm">
                    <thead>
                    <tr><th>Category</th><th>Income</th><th>Expenses</th></tr>
                    </thead>
                    <tbody id="report-category-rows"></tbody>
                </table>
            </div>
            <button type="button" class="btn btn-outline-primary" onclick="downloadReportCsv()">
                <i class="bi bi-download"></i> Download CSV Report
            </button>
        </div>
    </div>

    <!-- Balance -->
    <div class="m-3 text-center">
        <div class="fw-bold m-3">Your Balance</div>
        <div class="fw-bolder fs-3">₹<span id="balance">0.00</span></div>
    </div>

    <!-- Income and Expenses -->
    <div class="row mx-auto">
        <div class="col-6">
            <div class="alert alert-success text-center fw-bold">
                Income<br>₹<span id="income-amount">0.00</span>
            </div>
        </div>
        <div class="col-6">
            <div class="alert alert-danger text-center fw-bold">
                Expenses<br>₹<span id="expenses-amount">0.00</span>
            </div>
        </div>
    </div>

    <!-- Transaction Form -->
    <h4>Add Transaction</h4>
    <form id="transaction-form" class="m-3">
        <select class="form-select mb-3" id="trn-type" required>
            <option value="">Select Type</option>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
        </select>

        <select class="form-select mb-3" id="trn-category" required>
            <option value="">Select Category</option>
            <option value="Salary">Salary</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
        </select>

        <input class="form-control mb-3" type="number" id="trn-amount"
               placeholder="Enter Amount" min="0.01" step="0.01" required>

        <input class="form-control mb-3" type="text" id="trn-description"
               placeholder="Enter Description" maxlength="200" required>

        <input class="form-control mb-3" type="date" id="trn-date" required>

        <button type="submit" id="add-button" class="btn btn-primary">Add Transaction</button>
        <button type="button" class="btn btn-secondary" onclick="clearForm()">Cancel</button>
    </form>

    <!-- Transaction History -->
    <h4>Transaction History</h4>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="transaction_history"></tbody>
        </table>
    </div>
</div>


</body>
</html>
